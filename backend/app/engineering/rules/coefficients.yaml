version: 1

# Runoff coefficients by roof material.
#
# status: verified  = the exact value is stated by the cited source, or it is
#                     the source's own worked example.
# status: pending   = the cited range is transcribed and page-referenced, but
#                     the single design value is a RainWise selection that still
#                     needs professional review.
#
# The engine emits an info warning for any row whose status is not "verified".
# See docs/ENGINEERING_METHODOLOGY.md section 3 for the full discussion.
# No AI-generated value is used here.

sources:
  cpwd:
    title: "Rain Water Harvesting"
    publisher: "Central Public Works Department (CPWD), Government of India"
    locator: "Table 2, p. 14 - Runoff Co-efficient of Various Surfaces"
    url: "https://www.cpwd.gov.in/Publication/rain_wh.pdf"
    status: verified
  cpwd_reproduction:
    title: "Technical Design of Rainwater Harvesting"
    publisher: "Centre for Science and Environment (CSE), India"
    year: 2016
    locator: "Slide 'Runoff Coefficients and RWH potential' - reproduces CPWD Table 2"
    url: "https://cdn.cseindia.org/userfiles/Technical-Design-of-RWH.pdf"
    status: verified
  is15797:
    title: "IS 15797:2008 - Roof Top Rainwater Harvesting: Guidelines"
    publisher: "Bureau of Indian Standards"
    year: 2008
    locator: "Clause 5.1, p. 2 - roof runoff coefficient range 0.8 to 0.95"
    url: "https://www.icid.org/rfwaterharvesting_guidelines.pdf"
    status: verified

default: other

coefficients:
  tiles:
    value: 0.85
    source: cpwd
    status: verified
    range: [0.80, 0.90]
    range_status: verified
    note: "CPWD Table 2 (p. 14) gives 0.8-0.9 for tiles. The manual's worked example uses 0.85."
  concrete:
    value: 0.85
    source: cpwd
    status: pending
    range: [0.70, 0.95]
    range_status: verified
    note: "CPWD Table 2 gives 0.70-0.95 for concrete. RainWise uses 0.85, the same mid-range value as the CPWD tiles example. The exact single value is not a CPWD row; professional review pending."
  metal:
    value: 0.90
    source: cpwd
    status: pending
    range: [0.70, 0.90]
    range_status: verified
    note: "CPWD Table 2 gives 0.7-0.9 for corrugated metal sheets. RainWise uses the upper bound 0.90 (smooth sheet metal); the conservative alternative is 0.70. Professional review pending."
  asbestos:
    value: 0.80
    source: is15797
    status: pending
    range: [0.80, 0.95]
    range_status: verified
    note: "The reproduced CPWD Table 2 rows list tiles, corrugated metal, and concrete; no separate asbestos-cement row is shown. IS 15797 clause 5.1 gives 0.8-0.95 for roof catchments generally; RainWise uses the lower bound 0.80. Material-specific value and professional review pending."
  other:
    value: 0.80
    source: is15797
    status: pending
    range: [0.80, 0.95]
    range_status: verified
    note: "Conservative fallback for an unknown material. IS 15797 clause 5.1 gives 0.8-0.95; RainWise uses the lower bound. A coefficient_fallback warning is emitted."
